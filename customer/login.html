<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ingia | USAFI SMART</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#022B5B">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="../index.html" aria-label="USAFI SMART - Nyumbani">
        <img class="brand__logo" src="../assets/images/logo.png" alt="USAFI SMART" width="96" height="48">
      </a>
      <a class="btn btn--outline btn--sm" href="../index.html">Rudi Nyumbani</a>
    </div>
  </header>

  <main class="auth">
    <div class="auth__box">
      <h1>Ingia</h1>
      <p class="auth__sub">Akaunti ya mteja.</p>
      <form id="form" class="form">
        <div class="field">
          <label for="email">Barua pepe</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        </div>
        <div class="field">
          <label for="password">Nenosiri</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p class="form__msg" id="msg" role="alert" aria-live="polite"></p>
        <button class="btn btn--primary btn--block" type="submit">Ingia</button>
        <p class="form__links"><button type="button" class="linklike" id="forgot">Umesahau nenosiri?</button> <a href="register.html">Huna akaunti? Jisajili</a></p>
      </form>
    </div>
  </main>

  <script type="module">
    import { bindForm, login, resetPassword, authMessage, showLoginNotice } from "../shared/account.js";
    import { redirectIfSignedIn } from "../shared/session.js";

    redirectIfSignedIn();
    showLoginNotice();
    const form = document.getElementById("form");
    const ui = bindForm(form, function (d) { return login(d.email, d.password); }, { success: "Karibu. Inakupeleka..." });
    document.getElementById("forgot").addEventListener("click", async function () {
      try {
        await resetPassword(form.elements.email.value);
        ui.setMsg("Tumekutumia barua pepe ya kubadilisha nenosiri.", "ok");
      } catch (err) {
        ui.setMsg(authMessage(err), "error");
      }
    });
  </script>
</body>
</html>
